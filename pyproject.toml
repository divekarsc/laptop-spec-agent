[project]
name = "laptop-spec-agent"
version = "0.1.0"
description = "LangGraph agent that extracts laptop hardware specs from retail product pages using Playwright, Gemini, and web search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.14.4",
    "ddgs>=9.14.4",
    "duckduckgo-search>=8.1.1",
    "langchain-anthropic>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.3",
    "langgraph>=1.2.1",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]
